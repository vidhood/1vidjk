<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoHub</title>

<link rel="icon" type="image/png" href="/images/favicon.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f3f3;
    color:#111;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
}

.logo{
    color:#0f172a;
    font-size:18px;
    font-weight:bold;
    cursor:default;
    user-select:none;
}

.latest-btn{
    background:#0f172a;
    color:#fff;
    padding:12px 24px;
    border-radius:999px;
    font-size:14px;
    cursor:default;
    user-select:none;
}

.container{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.video-wrapper{
    position:relative;
    width:720px;
    max-width:100%;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}

video{
    width:100%;
    display:block;
    background:#000;
}

.video-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
}

.play-button{
    width:95px;
    height:95px;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    color:#fff;
    font-size:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.25s;
    backdrop-filter:blur(4px);
}

.play-button:hover{
    transform:scale(1.1);
    background:rgba(0,0,0,.9);
}

.message{
    text-align:center;
    font-size:15px;
    color:#555;
}

footer{
    text-align:center;
    padding:24px;
    font-size:13px;
    color:#666;
}

@media(max-width:768px){

    header{
        padding:14px 16px;
    }

    .video-wrapper{
        width:100%;
    }

    .play-button{
        width:80px;
        height:80px;
        font-size:36px;
    }
}
</style>

</head>

<body>

<header>
    <div class="logo">VideoHub</div>

```
<div class="latest-btn">
    <strong>Latest</strong>
</div>
```

</header>

<main class="container">

```
<div class="video-wrapper">

    <div class="video-overlay" id="playOverlay">
        <div class="play-button">▶</div>
    </div>

    <video
        id="video"
        controls
        controlsList="nodownload noplaybackrate"
        disablePictureInPicture
        preload="metadata"
        poster="https://img.magnific.com/premium-vector/neon-sign-thanks-watching-with-brick-wall-background-vector_118419-4424.jpg">

        <source id="videoSource" src="" type="video/mp4">

        Browser Anda tidak mendukung video.

    </video>

</div>

<div class="message" id="status">
    Memuat video...
</div>
```

</main>

<footer>
    Copyright © 2026 <strong>VideoHub</strong>
</footer>

<script>

// URL contoh:
// watch.html?id=yVNrLzoz1

const params = new URLSearchParams(window.location.search);
const videyId = params.get("id");

const video = document.getElementById("video");
const source = document.getElementById("videoSource");
const status = document.getElementById("status");
const overlay = document.getElementById("playOverlay");

if(videyId){

    source.src = `https://cdn.videy.co/${videyId}.mp4`;

    video.load();

    status.style.display = "none";

}else{

    status.innerHTML = `
        Tambahkan ID video pada URL.<br><br>
        Contoh:<br>
        ?id=yVNrLzoz1
    `;
}

overlay.addEventListener("click", () => {

    video.play();

    overlay.style.display = "none";

});

video.addEventListener("play", () => {

    overlay.style.display = "none";

});

video.addEventListener("pause", () => {

    if(video.currentTime > 0 && !video.ended){
        overlay.style.display = "flex";
    }

});

video.addEventListener("ended", () => {

    overlay.style.display = "flex";

});

document.addEventListener('contextmenu', function(e){
    e.preventDefault();
});

document.addEventListener('keydown', function(e){

    if(e.key === "F12"){
        e.preventDefault();
    }

    if(e.ctrlKey && e.shiftKey && e.key === "I"){
        e.preventDefault();
    }

    if(e.ctrlKey && e.shiftKey && e.key === "J"){
        e.preventDefault();
    }

    if(e.ctrlKey && e.key.toLowerCase() === "u"){
        e.preventDefault();
    }

});

video.addEventListener('dragstart', function(e){
    e.preventDefault();
});

</script>

</body>
</html>
